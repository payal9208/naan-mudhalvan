<!DOCTYPE html>
<html>
<head>
    <title>Movie Recommendations</title>
</head>
<body>

    <h1>🎬 Recommended Movies</h1>

    {% if recommendations %}
        <ul>
        {% for movie, rating in recommendations %}
            <li>
                <strong>{{ movie }}</strong>
                - Predicted Rating: {{ "%.2f"|format(rating) }}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No recommendations found.</p>
    {% endif %}

    <a href="/">⬅ Back to Home</a>

</body>
</html>
